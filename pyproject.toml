[project]
name = "sunxue-gates"
version = "1.1.0"
description = "Seven-layer gate harness for the sunxue skill (lint, security, regression, token budget, injection drill, mutation drill, claims-lint)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "sunxue-gates", email = "gates@sunxue.local" }]
dependencies = []

[project.scripts]
gates = "sunxue_gates.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sunxue_gates"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "basedpyright>=1.14",
    "coverage[toml]>=7.6",
    "diff-cover>=9.2",
    "mutmut>=3.0",
    "hypothesis>=6.112",
    "ty==0.0.75",
    "pytest-cov>=6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["mutants"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Plan 2.2 review: B010 is still used by tests/unit/test_results.py
# (setattr on CheckResult to verify it is frozen). The two monkey-patch
# tests we refactored (test_record_info_branch_when_metric_missing_from_expect
# + test_failures_incremented_when_mutator_drops_all_hits) no longer use
# B010 patterns, but the per-file-ignore stays because test_results.py
# still needs it. E402 stays — module-level conftest sys.path setup
# needs to run before some imports in the test files.
"tests/**/*.py" = ["E402", "B010"]

[tool.basedpyright]
typeCheckingMode = "standard"
include = ["src", "tests"]

[tool.ty]

[tool.ty.environment]
root = ["src"]

[tool.ty.src]
exclude = ["mutants"]

[tool.coverage.run]
branch = true
source = ["sunxue_gates"]
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.mutmut]
source_paths = ["src/sunxue_gates"]
# Plan 2.1: tables.py is pure data (keyword/pattern tokens) — mutating
# every literal is noise, not signal. Excluded via mutmut 3.x's documented
# ``do_not_mutate`` glob (empirically verified on mutmut 3.7.0: with this
# line present, ``mutmut run`` skips tables.py entirely; without it, every
# DRILLS / PII_PATTERNS / KEY_PHRASES literal gets a ""-wrap mutant).
# The golden contract (``tests/golden/literals.json``) keeps the table
# quality signal — mutating tables wouldn't catch new bugs, just churn.
do_not_mutate = ["src/sunxue_gates/tables.py"]
