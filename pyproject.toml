[project]
name = "sunxue-gates"
version = "1.3.1"
description = "Eight-layer gate harness for the sunxue skill (lint_structure, scan_security, regression_output, token_budget, injection_drill, mutation_drill, lint_claims, lint_pii)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "onepisYa" }]
dependencies = []

[project.scripts]
gates = "sunxue_gates.__main__:main"

# Plan 3.3 — precise token counting (tiktoken). Install via:
#   uv sync --extra precise
# When installed, ``SUNXUE_PRECISE=1`` switches the token_budget gate to
# tiktoken cl100k_base encoding; without it the gate falls back to the
# chars/3 heuristic with an ``estimate=heuristic`` tag on every line.
[project.optional-dependencies]
precise = ["tiktoken"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sunxue_gates"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "basedpyright>=1.14",
    "coverage[toml]>=7.6",
    "diff-cover>=9.2",
    "mutmut>=3.0",
    "hypothesis>=6.112",
    "ty==0.0.75",
    "pytest-cov>=6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["mutants"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Plan 2.2 review: B010 is still used by tests/unit/test_results.py
# (setattr on CheckResult to verify it is frozen). The two monkey-patch
# tests we refactored (test_record_info_branch_when_metric_missing_from_expect
# + test_failures_incremented_when_mutator_drops_all_hits) no longer use
# B010 patterns, but the per-file-ignore stays because test_results.py
# still needs it. E402 stays — module-level conftest sys.path setup
# needs to run before some imports in the test files.
"tests/**/*.py" = ["E402", "B010"]

[tool.basedpyright]
typeCheckingMode = "standard"
include = ["src", "tests"]

[tool.ty]

[tool.ty.environment]
root = ["src", "tests"]

[tool.ty.src]
exclude = ["mutants"]

[tool.coverage.run]
branch = true
source = ["sunxue_gates"]
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true

# Plan 3.4 — performance budgets for the eight-stage acceptance chain.
# ``gates --all`` reads these (in seconds) and FAILS with a budget-exceeded
# message when any stage exceeds its cap. Defaults are conservative; tighten
# them as the suite stabilizes.
#
# mutmut budget was bumped 30→45 in the lint_pii gate addition (档 ①
# of the enforcement design): the new src/ surface added ~280 LoC to
# the mutation scan, which pushed the previous 30s cap over the edge
# on a clean run. 45s leaves ~10s headroom for the synthesis-deferred
# counters that 档 ② will introduce without needing another bump.
#
# v1.3.0 cluster A F14: defaults are now declared under
# [tool.sunxue.defaults] (single source of truth, read by
# sunxue_gates.__main__._load_budgets). The hard-coded safety net in
# code mirrors these values; if you change one, change the other.
[tool.sunxue.defaults]
gates_all = 180
pytest = 5
mutmut = 180

[tool.sunxue.budgets]
gates_all = 180
pytest = 5
# mutmut budget: v1.2.2 起 45s → 120s。mutmut 3.7.0 跑 13 文件 2581 个
# 变异实测 ~80s (v1.2.2 时点; v1.3 起 14 文件 2582, audit-v4 N11 更新),
# 旧 45s budget 会撞 exit 75 (用户豁免 'mutmut 时间长一点
# 没关系')。3.7.1 上游 collection bug 修复未发版, 单纯放宽 budget。
# v1.3 mutmut 升级 3.7.1+ 后回收此放宽。
#
# v1.3.0 集群 A 抽常量 + 集群 D 加 1 reference/1 example 表面略增, 累计
# gates_all 实测 ~108s, 旧 60s budget 会撞 exit 75. gates_all 同步放宽
# 60 → 120s. 这是 v1.2.2 mutmut budget 放宽的同源累积效应, 不算新债.
# v1.3.1 (audit-v4): meta/yingxue 接线 + golden 扩五模块后变异体
# 2582 → 2607, 全链实测 120.42s 顶破 120s gates_all budget (超 0.42s),
# 同源累积效应再放宽 120 → 180s. mutmut 阶段同批实测 112.8/119.4/132.3s
# 抖动, 120s budget 进入不稳定区, 同步 120 → 180s.
mutmut = 180

[tool.mutmut]
source_paths = ["src/sunxue_gates"]
# Plan 2.2: these two test files contain multi-line f-strings whose
# libcst-based mutation collector cannot parse (SyntaxError on collection).
# mutmut 3.7.0 documented pytest_add_cli_args_test_selection key
# passes these args to every pytest invocation mutmut makes.
pytest_add_cli_args_test_selection = [
    "--ignore=tests/unit/test_golden_literals.py",
    "--ignore=tests/unit/test_lint_claims.py",
]

# Plan 2.1: tables.py is pure data (keyword/pattern tokens) — mutating
# every literal is noise, not signal. Excluded via mutmut 3.x's documented
# ``do_not_mutate`` glob (empirically verified on mutmut 3.7.0: with this
# line present, ``mutmut run`` skips tables.py entirely; without it, every
# DRILLS / PII_PATTERNS / KEY_PHRASES literal gets a ""-wrap mutant).
# The golden contract (``tests/golden/literals.json``) keeps the table
# quality signal — mutating tables wouldn't catch new bugs, just churn.
do_not_mutate = ["src/sunxue_gates/tables.py"]
